# .github/workflows/shopify_pipeline.yml
name: Shopify Daily Intelligence Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC (9:00 AM Kenyan Time / EAT)
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pandas

      - name: Execute Pipeline
        run: |
          python -m shopify.pipeline

      - name: Commit & Push SQLite Database Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shopify_intelligence.db shopify_supplement_intelligence.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Shopify intelligence snapshot [skip ci]" && git push)